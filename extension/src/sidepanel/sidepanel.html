<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>视频陪学 AI 助教</title>
  <link rel="stylesheet" href="sidepanel.css" />
  <script src="../../vendor/mermaid.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="hd">
      <div class="hd-l">
        <div class="logo">AI</div>
        <div>
          <div class="title">视频陪学 AI 助教</div>
          <div class="sub" id="topicLine">未开始 · 待命</div>
        </div>
      </div>
      <span class="badge" id="stateBadge">待命</span>
    </header>

    <div class="toolbar">
      <button class="btn primary" id="btnStart">开始陪学</button>
      <button class="btn" id="btnPause">暂停 / 小结</button>
      <button class="btn danger" id="btnEnd">课程结束</button>
      <button class="btn ghost" id="btnSettings" title="设置">⚙</button>
    </div>

    <div class="row">
      <select id="srcMode">
        <option value="auto">转写源：自动（字幕优先）</option>
        <option value="webspeech">转写源：麦克风语音识别（免费）</option>
        <option value="manual">转写源：手动粘贴文本</option>
        <option value="cloud">转写源：页面音频 + 云端 ASR</option>
      </select>
    </div>

    <div class="row" id="manualRow" style="display:none">
      <textarea id="manualInput" rows="3" placeholder="粘贴课程字幕 / 讲稿文本，点「推送」模拟流式输入"></textarea>
      <div class="row-2" style="margin-top:6px">
        <button class="btn small" id="btnPush">推送</button>
        <button class="btn small ghost" id="btnPushFile">导入 .txt/.srt</button>
        <input type="file" id="fileInput" accept=".txt,.srt,.vtt,.md" hidden />
      </div>
    </div>

    <section class="panel">
      <div class="ph">
        <h3>实时转写</h3>
        <span class="meta" id="charCount">0 字</span>
      </div>
      <div class="transcript" id="transcript"><div class="empty">等待课程音频…</div></div>
    </section>

    <section class="panel grow">
      <div class="ph">
        <h3>结构化笔记</h3>
        <span class="meta" id="noteCount">0 条</span>
      </div>
      <div class="notes" id="notes"><div class="empty">开始听课后，知识点会自动出现在这里</div></div>
    </section>

    <section class="panel" id="graphPanel" style="display:none">
      <div class="ph">
        <h3>知识图谱</h3>
        <div class="ph-r">
          <button class="btn tiny ghost" id="btnCopyMmd">复制 Mermaid</button>
        </div>
      </div>
      <div class="topics" id="topics"></div>
      <div class="graph" id="graph"></div>
    </section>

    <footer class="ft">
      <button class="btn small ghost" id="btnExport">导出 Markdown</button>
      <button class="btn small ghost" id="btnHistory">历史课程</button>
      <button class="btn small ghost" id="btnClear">清空</button>
    </footer>
  </div>

  <div class="modal-mask" id="mask" style="display:none">
    <div class="modal">
      <div class="modal-hd"><span id="modalTitle">详情</span><button class="x" id="modalClose">×</button></div>
      <div class="modal-bd" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" style="display:none"></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
